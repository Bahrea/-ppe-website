<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PPE | Pioneer Projects Executer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #222222;
        }

        /* HEADER */
        header {
            height: 90px;
            padding: 0 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            border-bottom: 1px solid #eeeeee;
        }

        .logo {
            width: 190px;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 35px;
        }

        nav a {
            text-decoration: none;
            color: #333333;
            font-size: 14px;
            font-weight: 600;
        }

        nav a:hover {
            color: #1769aa;
        }

        .language {
            border: 1px solid #1769aa;
            color: #1769aa;
            padding: 9px 15px;
            text-decoration: none;
            font-size: 13px;
        }

        /* HERO */
        .hero {
            min-height: calc(100vh - 90px);
            display: flex;
            align-items: center;
            padding: 8%;
            background:
                linear-gradient(
                    90deg,
                    rgba(15, 45, 75, 0.95),
                    rgba(15, 45, 75, 0.72)
                );
            color: white;
        }

        .hero-content {
            max-width: 850px;
        }

        .small-title {
            font-size: 13px;
            letter-spacing: 4px;
            margin-bottom: 25px;
            opacity: 0.8;
        }

        h1 {
            font-size: clamp(55px, 8vw, 110px);
            line-height: 0.95;
            margin-bottom: 30px;
        }

        h1 span {
            font-weight: 300;
        }

        .hero p {
            max-width: 600px;
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 40px;
        }

        .button {
            display: inline-block;
            background: white;
            color: #1769aa;
            padding: 15px 28px;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 800px) {
            header {
                padding: 0 5%;
            }

            .logo {
                width: 140px;
            }

            nav a {
                display: none;
            }

            .hero {
                padding: 10% 6%;
            }

            h1 {
                font-size: 55px;
            }
        }
    </style>
</head>

<body>

<header>

    <img src="ppe-logo.avif"
         alt="Pioneer Projects Executer"
         class="logo">

    <nav>
        <a href="#home">HOME</a>
        <a href="#about">ABOUT</a>
        <a href="#services">SERVICES</a>
        <a href="#projects">PROJECTS</a>
        <a href="#contact">CONTACT</a>

        <a href="#" class="language">العربية</a>
    </nav>

</header>


<section class="hero" id="home">

    <div class="hero-content">

        <p class="small-title">
            DESIGN • CONSTRUCTION • FIT-OUT
        </p>

        <h1>
            WE BUILD<br>
            <span>WHAT YOU</span><br>
            BELIEVE IN.
        </h1>

        <p>
            Pioneer Projects Executer delivers integrated
            design, construction and fit-out solutions
            across Saudi Arabia.
        </p>

        <a href="#projects" class="button">
            EXPLORE OUR PROJECTS →
        </a>

    </div>

</section>

</body>
</html>
